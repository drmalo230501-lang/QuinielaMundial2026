
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiniela Mundial 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#07071a;color:#fff;min-height:100vh;overscroll-behavior:none;}
:root{
  --gold:#FFD700;--green:#00C853;--red:#C62828;--blue:#1a6ef5;
  --card:#10103a;--card2:#181860;--border:rgba(255,255,255,0.13);--muted:rgba(255,255,255,0.5);
  --hit-exact-bg:rgba(0,160,60,0.22);--hit-exact-border:rgba(0,220,100,0.55);
  --hit-win-bg:rgba(0,100,30,0.15);--hit-win-border:rgba(0,200,83,0.3);
  --miss-bg:rgba(140,0,0,0.2);--miss-border:rgba(220,50,50,0.5);
}
.app{max-width:480px;margin:0 auto;padding:0 0 80px;}

/* HEADER */
.header{text-align:center;padding:18px 12px 10px;background:linear-gradient(180deg,#0d0d30 0%,#07071a 100%);}
.header h1{font-size:20px;font-weight:800;background:linear-gradient(90deg,#fff 0%,#FFD700 50%,#fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.5px;}
.header p{color:var(--muted);font-size:11px;margin-top:3px;}
.trophy{font-size:32px;display:block;margin-bottom:4px;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0d0d30;border-top:1px solid var(--border);display:flex;z-index:100;max-width:480px;margin:0 auto;left:50%;transform:translateX(-50%);}
.bnav-btn{flex:1;padding:10px 4px 8px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;transition:all .2s;}
.bnav-btn.active{color:var(--gold);}
.bnav-btn .icon{font-size:18px;}
.bnav-btn.active .icon{transform:scale(1.1);}

/* CARDS */
.card{background:var(--card);border-radius:14px;padding:13px;margin:0 10px 10px;border:1px solid var(--border);}
.card-title{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--gold);}
.section-pad{padding:10px 10px 0;}

/* INPUTS */
.ig{margin-bottom:12px;}
.ig label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
.ig input{width:100%;padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:15px;outline:none;-webkit-appearance:none;}
.ig input:focus{border-color:var(--gold);}

/* BUTTONS */
.btn{padding:12px 20px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;transition:all .2s;-webkit-appearance:none;}
.btn-primary{background:var(--gold);color:#000;}
.btn-secondary{background:rgba(255,255,255,0.1);color:#fff;border:1px solid var(--border);}
.btn-danger{background:var(--red);color:#fff;}
.btn-success{background:var(--green);color:#000;}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:8px;}
.btn-full{width:100%;}

/* MATCH CARD — mobile friendly */
.mcard{background:var(--card2);border-radius:12px;padding:10px 10px 8px;margin-bottom:8px;border:1px solid var(--border);transition:border-color .2s;}
.mcard.exact{background:var(--hit-exact-bg);border-color:var(--hit-exact-border);}
.mcard.winner{background:var(--hit-win-bg);border-color:var(--hit-win-border);}
.mcard.miss{background:var(--miss-bg);border-color:var(--miss-border);}

.mcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mcard-meta{font-size:9px;color:var(--muted);}
.mcard-meta strong{color:var(--gold);font-size:10px;}
.mcard-result-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.rb-exact{background:rgba(0,200,83,0.25);color:#69ff6e;border:1px solid rgba(0,200,83,0.5);}
.rb-winner{background:rgba(255,215,0,0.2);color:var(--gold);border:1px solid rgba(255,215,0,0.4);}
.rb-miss{background:rgba(220,50,50,0.2);color:#ff8a8a;border:1px solid rgba(220,50,50,0.4);}

.mcard-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;}
.team-side{display:flex;flex-direction:column;align-items:center;gap:3px;}
.team-flag{font-size:26px;line-height:1;}
.team-name{font-size:10px;text-align:center;color:rgba(255,255,255,0.85);line-height:1.2;max-width:80px;}
.team-name.winner-team{color:var(--gold);font-weight:700;}

.score-center{display:flex;flex-direction:column;align-items:center;gap:5px;}
.score-row{display:flex;align-items:center;gap:6px;}
.score-inp{width:38px;height:38px;text-align:center;background:#07071a;border:2px solid var(--gold);border-radius:8px;color:var(--gold);font-size:18px;font-weight:700;outline:none;-webkit-appearance:none;appearance:none;}
.score-inp:disabled{opacity:0.45;border-color:var(--border);color:var(--muted);}
.score-inp[type=number]::-webkit-inner-spin-button,
.score-inp[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.score-vs{font-size:14px;color:var(--muted);font-weight:700;}
.score-real{font-size:11px;color:var(--muted);margin-top:1px;}
.score-real strong{color:#fff;}

.win-btns{display:flex;gap:4px;justify-content:center;}
.win-btn{flex:1;max-width:60px;padding:5px 4px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--muted);border-radius:7px;font-size:10px;cursor:pointer;transition:all .15s;-webkit-appearance:none;}
.win-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700;}
.win-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* GROUP HEADER */
.grp-header{display:flex;align-items:center;gap:7px;padding:8px 10px;background:linear-gradient(90deg,#162a5e,#0a143a);border-radius:10px;margin:10px 10px 6px;}
.grp-badge{background:var(--gold);color:#000;font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;}
.grp-title{font-size:12px;font-weight:700;color:var(--gold);}

/* JORNADA HEADER */
.jornada-hdr{display:flex;align-items:center;gap:8px;padding:10px 10px 4px;}
.jornada-hdr h3{font-size:13px;font-weight:700;color:#fff;}
.jornada-sep{flex:1;height:1px;background:var(--border);}

/* PROGRESS */
.prog-wrap{margin:0 10px 10px;}
.prog-bar{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),#ff9900);border-radius:3px;transition:width .3s;}
.prog-text{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}

/* RANKING TABLE */
.rank-table{width:100%;border-collapse:collapse;font-size:11px;}
.rank-table th{background:#0a0a25;color:var(--gold);padding:7px 5px;text-align:center;font-size:10px;border-bottom:1px solid var(--border);position:sticky;top:0;}
.rank-table th:first-child{text-align:left;}
.rank-table td{padding:8px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.05);}
.rank-table td:first-child{text-align:left;}
.pts-big{font-size:15px;font-weight:800;color:var(--gold);}
.diff-red{color:#ff8a8a;font-weight:700;}
.diff-zero{color:var(--gold);font-weight:700;}
.bs{display:inline-block;padding:2px 5px;border-radius:5px;font-size:10px;font-weight:700;}
.bs-g{background:rgba(0,200,83,0.2);color:#69ff6e;}
.bs-y{background:rgba(255,215,0,0.2);color:var(--gold);}
.bs-r{background:rgba(220,50,50,0.2);color:#ff8a8a;}

/* PRIZE BANNER */
.prize-banner{background:linear-gradient(135deg,#1a1500,#2d2200);border:2px solid var(--gold);border-radius:16px;padding:16px;text-align:center;margin:0 10px 12px;}
.prize-amount{font-size:38px;font-weight:800;color:var(--gold);line-height:1;}
.prize-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* RESULTS */
.res-card{background:var(--card2);border-radius:12px;padding:10px;margin-bottom:7px;border:1px solid var(--border);}
.res-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;}
.res-team{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;text-align:center;}
.res-score{text-align:center;}
.res-score-val{font-size:22px;font-weight:800;color:var(--gold);}
.res-score-val.pending{font-size:13px;color:var(--muted);font-weight:400;}
.res-win-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;margin-top:3px;display:inline-block;}
.rwt-h{background:rgba(0,200,83,0.2);color:#69ff6e;border:1px solid rgba(0,200,83,0.4);}
.rwt-a{background:rgba(0,100,255,0.2);color:#88aaff;border:1px solid rgba(0,100,255,0.4);}
.rwt-d{background:rgba(255,215,0,0.15);color:var(--gold);border:1px solid rgba(255,215,0,0.3);}
.res-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:5px;border-top:1px solid rgba(255,255,255,0.07);padding-top:4px;}

/* KNOCKOUT SECTION */
.ko-round-label{text-align:center;font-size:11px;font-weight:700;color:var(--gold);background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);border-radius:8px;padding:5px 12px;margin:10px 10px 8px;letter-spacing:0.5px;}
.ko-match{background:var(--card2);border-radius:12px;padding:10px;margin:0 10px 8px;border:1px solid var(--border);}
.ko-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;}
.ko-team{display:flex;flex-direction:column;align-items:center;gap:3px;}
.ko-flag{font-size:22px;}
.ko-name{font-size:10px;text-align:center;color:rgba(255,255,255,0.8);max-width:75px;line-height:1.2;}
.ko-name.winner{color:var(--gold);font-weight:700;}
.ko-score-center{display:flex;flex-direction:column;align-items:center;gap:4px;}
.ko-score-row{display:flex;align-items:center;gap:5px;}
.ko-score-inp{width:34px;height:34px;text-align:center;background:#07071a;border:2px solid var(--gold);border-radius:7px;color:var(--gold);font-size:16px;font-weight:700;outline:none;-webkit-appearance:none;appearance:none;}
.ko-score-inp:disabled{opacity:0.4;border-color:var(--border);color:var(--muted);}
.ko-score-inp[type=number]::-webkit-inner-spin-button,
.ko-score-inp[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
.ko-vs{font-size:12px;color:var(--muted);}
.ko-win-btns{display:flex;gap:3px;}
.ko-win-btn{flex:1;max-width:55px;padding:4px 3px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--muted);border-radius:6px;font-size:9px;cursor:pointer;-webkit-appearance:none;}
.ko-win-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700;}
.ko-match-lbl{font-size:9px;color:var(--muted);text-align:center;margin-bottom:5px;}
.ko-pen-note{font-size:9px;color:var(--muted);text-align:center;margin-top:4px;font-style:italic;}

/* ALERT */
.alert{padding:10px 12px;border-radius:10px;font-size:12px;margin:0 10px 10px;line-height:1.4;}
.alert-w{background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.4);color:var(--gold);}
.alert-e{background:rgba(198,40,40,0.14);border:1px solid rgba(198,40,40,0.4);color:#ff8a8a;}
.locked-tag{background:rgba(198,40,40,0.2);border:1px solid rgba(198,40,40,0.5);border-radius:6px;padding:2px 7px;font-size:10px;color:#ff8a8a;}

/* INSTRUCTIONS */
.instr-block{margin-bottom:14px;}
.instr-block h3{font-size:12px;color:var(--gold);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(255,215,0,0.2);}
.instr-block p,.instr-block li{font-size:12px;line-height:1.65;color:rgba(255,255,255,0.8);margin-bottom:3px;}
.instr-block ul{padding-left:14px;}
.ibadge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;margin:2px;}
.ibadge-y{background:rgba(255,215,0,0.18);color:var(--gold);border:1px solid rgba(255,215,0,0.4);}
.ibadge-g{background:rgba(0,200,83,0.14);color:#69ff6e;border:1px solid rgba(0,200,83,0.3);}

/* ADMIN */
.admin-score-inp{width:34px;height:32px;text-align:center;background:#07071a;border:1px solid var(--gold);border-radius:6px;color:var(--gold);font-size:15px;font-weight:700;outline:none;-webkit-appearance:none;}
.admin-score-inp[type=number]::-webkit-inner-spin-button,
.admin-score-inp[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}

/* UTIL */
.sep{border:none;border-top:1px solid var(--border);margin:10px 0;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.text-muted{color:var(--muted);}
.text-gold{color:var(--gold);}
.mt-8{margin-top:8px;}
.scroll-content{padding-bottom:20px;}

/* FLOATING SAVE BUTTON */
.fab-save{
  position:fixed;bottom:80px;right:16px;z-index:200;
  background:linear-gradient(135deg,#FFD700,#ff9900);
  color:#000;border:none;border-radius:50px;
  padding:12px 18px;font-size:13px;font-weight:800;
  box-shadow:0 4px 20px rgba(255,180,0,0.55);
  cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:all .2s;-webkit-appearance:none;
  white-space:nowrap;
}
.fab-save:active{transform:scale(0.93);}
.fab-save.saved{background:linear-gradient(135deg,#00C853,#00a040);color:#fff;}

/* EDIT PICKS MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:#10103a;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:16px 12px 30px;}
.modal-handle{width:40px;height:4px;background:rgba(255,255,255,0.25);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-size:15px;font-weight:800;color:var(--gold);margin-bottom:12px;text-align:center;}
.modal-group-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px;}
.modal-group-tabs::-webkit-scrollbar{display:none;}
.mgtab{padding:5px 10px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--muted);border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-appearance:none;}
.mgtab.active{background:var(--gold);color:#000;border-color:var(--gold);}
.edit-match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;background:var(--card2);border-radius:9px;padding:8px 8px;margin-bottom:6px;border:1px solid var(--border);}
.edit-team{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;text-align:center;color:rgba(255,255,255,0.8);}
.edit-score-center{display:flex;flex-direction:column;align-items:center;gap:4px;}
.edit-score-row{display:flex;align-items:center;gap:5px;}
.edit-inp{width:36px;height:34px;text-align:center;background:#07071a;border:2px solid var(--gold);border-radius:7px;color:var(--gold);font-size:16px;font-weight:700;outline:none;-webkit-appearance:none;}
.edit-inp[type=number]::-webkit-inner-spin-button,.edit-inp[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
</style>
</head>

// ===================== GROUP CALC =====================
function getGroupStandings(g, predsObj){
  // predsObj: {matchId: {h,a}} — predictions or results
  const teams=GROUPS[g].map(t=>({t,pts:0,gf:0,ga:0,gd:0,w:0,d:0,l:0}));
  const matches=ALL.filter(m=>m.g===g);
  matches.forEach(m=>{
    const p=predsObj[m.id];
    if(!p||p.h===''||p.h===undefined||p.a===''||p.a===undefined) return;
    const rh=parseInt(p.h),ra=parseInt(p.a);
    if(isNaN(rh)||isNaN(ra)) return;
    const ht=teams.find(x=>x.t===m.h), at=teams.find(x=>x.t===m.a);
    if(!ht||!at) return;
    ht.gf+=rh; ht.ga+=ra; ht.gd+=rh-ra;
    at.gf+=ra; at.ga+=rh; at.gd+=ra-rh;
    if(rh>ra){ht.pts+=3;ht.w++;at.l++;}
    else if(ra>rh){at.pts+=3;at.w++;ht.l++;}
    else{ht.pts+=1;ht.d++;at.pts+=1;at.d++;}
  });
  return teams.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function getGroupPos(g, pos, preds){
  const st=getGroupStandings(g,preds);
  return st[pos-1]?st[pos-1].t:'?';
}

// Get 3rd place teams from all groups sorted
function getBest3rds(preds){
  const thirds=[];
  'ABCDEFGHIJKL'.split('').forEach(g=>{
    const st=getGroupStandings(g,preds);
    if(st[2]) thirds.push({t:st[2].t,pts:st[2].pts,gd:st[2].gd,gf:st[2].gf,g});
  });
  thirds.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  return thirds;
}

function resolveKOTeam(pos, preds, koPreds){
  // pos like '1A', '2B', '3ABCDF', 'Gana P74', 'Pierde P101'
  if(!pos) return '?';
  const m1=pos.match(/^(\d)([A-L])$/);
  if(m1) return getGroupPos(m1[2],parseInt(m1[1]),preds);
  if(pos.startsWith('3')){
    // Best thirds
    const thirds=getBest3rds(preds);
    const allowed=pos.slice(1).split('');
    const filtered=thirds.filter(x=>allowed.includes(x.g));
    // For specific slot, we simplify: return top from filtered by slot index
    // Here we just return in order from best3rds filtered
    const idx=0; // simplified: first available
    return filtered[idx]?filtered[idx].t:'?';
  }
  const mGana=pos.match(/^Gana P(\d+)$/);
  if(mGana){
    const pid='p'+mGana[1];
    const kr=koPreds[pid];
    if(!kr||kr.h===''||kr.a===''||kr.h===undefined) return '?';
    const rh=parseInt(kr.h),ra=parseInt(kr.a);
    if(isNaN(rh)||isNaN(ra)) return '?';
    // need to know who played
    const km=KO_MATCHES.find(x=>x.id===pid);
    if(!km) return '?';
    const ht=resolveKOTeam(km.hPos,preds,koPreds);
    const at=resolveKOTeam(km.aPos,preds,koPreds);
    return rh>ra?ht:ra>rh?at:'?';
  }
  const mPierde=pos.match(/^Pierde P(\d+)$/);
  if(mPierde){
    const pid='p'+mPierde[1];
    const kr=koPreds[pid];
    if(!kr||kr.h===''||kr.a===''||kr.h===undefined) return '?';
    const rh=parseInt(kr.h),ra=parseInt(kr.a);
    if(isNaN(rh)||isNaN(ra)) return '?';
    const km=KO_MATCHES.find(x=>x.id===pid);
    if(!km) return '?';
    const ht=resolveKOTeam(km.hPos,preds,koPreds);
    const at=resolveKOTeam(km.aPos,preds,koPreds);
    return rh>ra?at:ra>rh?ht:'?';
  }
  return pos;
}

// ===================== SCORING =====================
function matchResult(pred,real){
  if(!real||real.h===''||real.h===undefined||real.a===''||real.a===undefined) return 'pending';
  const rh=parseInt(real.h),ra=parseInt(real.a);
  if(isNaN(rh)||isNaN(ra)) return 'pending';
  if(!pred||pred.h===''||pred.h===undefined) return 'pending';
  const ph=parseInt(pred.h)||0,pa=parseInt(pred.a)||0;
  const rw=rh>ra?'h':ra>rh?'a':'d',pw=ph>pa?'h':pa>ph?'a':'d';
  if(rw!==pw) return 'miss';
  if(rh===ph&&ra===pa) return 'exact';
  return 'winner';
}
function calcStats(preds){
  let total=0,exact=0,winner=0,miss=0,played=0;
  for(const m of ALL){
    const res=matchResult(preds[m.id],S.results[m.id]);
    if(res==='pending') continue;
    played++;
    if(res==='exact'){exact++;total+=2;}
    else if(res==='winner'){winner++;total+=1;}
    else miss++;
  }
  return{total,exact,winner,miss,played};
}
function getRanking(){
  return Object.entries(S.users).filter(([,u])=>u.locked)
    .map(([n,u])=>({n,...calcStats(u.preds||{})}))
    .sort((a,b)=>b.total-a.total||b.exact-a.exact);
}

function buildMatchCard(m,pred,locked){
  const ph=pred.h!==undefined?pred.h:'', pa=pred.a!==undefined?pred.a:'';
  const phn=ph===''?-1:parseInt(ph), pan=pa===''?-1:parseInt(pa);
  const win=phn>=0&&pan>=0?(phn>pan?'h':pan>phn?'a':'d'):'';
  const dis=locked?'disabled':'';
  const real=S.results[m.id];
  const res=matchResult({h:ph,a:pa},real);
  let cls='';
  let resBadge='';
  if(real&&real.h!==''&&real.h!==undefined){
    cls=res==='exact'?'exact':res==='winner'?'winner':res==='miss'?'miss':'';
    const bl=res==='exact'?['rb-exact','✅ +2pts']:res==='winner'?['rb-winner','✔ +1pt']:['rb-miss','❌ 0pts'];
    resBadge=`<span class="mcard-result-badge ${bl[0]}">${bl[1]}</span>`;
  }
  const realTxt=real&&real.h!==''&&real.h!==undefined?`Real: <strong>${real.h}-${real.a}</strong>`:` `;
  const hWin=win==='h'||(!locked&&win==='h');
  const aWin=win==='a'||(!locked&&win==='a');
  return `<div class="mcard ${cls}">
    <div class="mcard-top">
      <div class="mcard-meta"><strong>${m.d}</strong> · ${m.t} CST · ${m.v}</div>
      ${resBadge}
    </div>
    <div class="mcard-teams">
      <div class="team-side">
        <span class="team-flag">${F(m.h)}</span>
        <span class="team-name ${win==='h'?'winner-team':''}">${m.h}</span>
      </div>
      <div class="score-center">
        <div class="score-row">
          <input type="number" class="score-inp" min="0" max="20" value="${ph}" ${dis}
            oninput="SP('${m.id}','h',this.value)" inputmode="numeric" pattern="[0-9]*" />
          <span class="score-vs">-</span>
          <input type="number" class="score-inp" min="0" max="20" value="${pa}" ${dis}
            oninput="SP('${m.id}','a',this.value)" inputmode="numeric" pattern="[0-9]*" />
        </div>
        <div class="win-btns">
          <button class="win-btn ${win==='h'?'active':''}" ${dis} onclick="SW('${m.id}','h')">${F(m.h)}</button>
          <button class="win-btn ${win==='d'?'active':''}" ${dis} onclick="SW('${m.id}','d')">EMP</button>
          <button class="win-btn ${win==='a'?'active':''}" ${dis} onclick="SW('${m.id}','a')">${F(m.a)}</button>
        </div>

}

function buildResCard(m,r,isKO=false){
  const hasR=r&&r.h!==''&&r.h!==undefined;
  const rh=hasR?parseInt(r.h):null, ra=hasR?parseInt(r.a):null;
  let winTag='';
  if(hasR){
    if(rh>ra) winTag=`<span class="res-win-tag rwt-h">${F(m.h)} Local</span>`;
    else if(ra>rh) winTag=`<span class="res-win-tag rwt-a">${F(m.a)} Visita</span>`;
    else winTag=`<span class="res-win-tag rwt-d">Empate</span>`;
  }
  return `<div class="res-card">
    <div class="res-teams">
      <div class="res-team"><span style="font-size:22px;">${F(m.h)}</span><span>${m.h}</span></div>
      <div class="res-score">
        ${hasR
          ?`<div class="res-score-val">${rh} - ${ra}</div>${winTag}`
          :`<div class="res-score-val pending">vs</div>`}
      </div>
      <div class="res-team"><span style="font-size:22px;">${F(m.a)}</span><span>${m.a}</span></div>
    </div>
    <div class="res-meta"><span>${m.d||''}</span><span>${m.t||''} · ${m.v||''}</span></div>
  </div>`;
}

          <span class="ibadge ibadge-g">+1 pt extra — marcador exacto = 2 pts</span>
        </div>
        <p>Ejemplo: predices <em>México 2-1</em> y sale 2-1 → <strong style="color:var(--green);">2 pts</strong>. Si sale 3-1 → <strong style="color:var(--gold);">1 pt</strong>. Si sale 0-1 → <strong style="color:#ff8a8a;">0 pts</strong>.</p>
      </div>
      <div class="instr-block"><h3>🎨 Colores en tu quiniela</h3><ul>
        <li><strong style="color:#69ff6e;">Verde oscuro ✅</strong> — Marcador exacto (+2 pts)</li>
        <li><strong style="color:var(--gold);">Verde claro ✔</strong> — Solo ganador (+1 pt)</li>
        <li><strong style="color:#ff8a8a;">Rojo ❌</strong> — Fallido (0 pts)</li>
        <li><strong style="color:var(--muted);">Sin color</strong> — Aún no jugado</li>
      </ul></div>
      <div class="instr-block"><h3>💰 Premio</h3><p>Cada participante aporta la cantidad acordada. El total va al que más puntos acumule al final. El admin configura el monto.</p></div>
      <div class="instr-block"><h3>⚠️ Importante</h3><ul>
        <li>Una vez guardada, no puedes modificar tu quiniela</li>
        <li>Solo el administrador puede desbloquearte si es necesario</li>
        <li>Contraseña admin: solo la conoce el organizador</li>
      </ul></div>
    </div>
  </div>`;
}

// ===================== EVENTS =====================
window.ST=t=>{S.tab=t;render();const sc=document.getElementById('sc');if(sc)sc.scrollTop=0;};
window.LO=()=>{S.cur=null;S.admin=false;S.tab='grupos';render();};
window.DL=()=>{
  const n=(document.getElementById('ln')||{}).value||'';
  const name=n.trim();
  if(!name){showErr('Por favor ingresa tu nombre');return;}
  if(!S.users[name])S.users[name]={preds:{},kopreds:{},locked:false,kolocked:false};
  S.cur=name;S.tab='grupos';save();render();
};
window.DA=()=>{
  const p=(document.getElementById('ap2')||{}).value||'';
  if(p===ADMIN_PASS){S.admin=true;S.tab='ar';render();}
  else showErr('Contraseña incorrecta');
};
function showErr(msg){const el=document.getElementById('lerr');if(el)el.innerHTML=`<div class="alert alert-e">${msg}</div>`;}

window.SP=(id,side,val)=>{
  const u=S.users[S.cur];if(!u||u.locked)return;
  if(!u.preds[id])u.preds[id]={h:'',a:''};
  u.preds[id][side]=val===''?'':(parseInt(val)>=0?parseInt(val):0);
  save();
  const filled=ALL.filter(m=>u.preds[m.id]&&u.preds[m.id].h!==''&&u.preds[m.id].a!=='').length;
  const pf=document.getElementById('pfill');
  if(pf)pf.style.width=Math.round((filled/TOTAL)*100)+'%';
};
window.SW=(id,win)=>{
  const u=S.users[S.cur];if(!u||u.locked)return;
  if(!u.preds[id])u.preds[id]={h:'',a:''};
  const p=u.preds[id];
  const h=parseInt(p.h)>=0?parseInt(p.h)||0:0,a=parseInt(p.a)>=0?parseInt(p.a)||0:0;
  if(win==='h'){p.h=h>a?h:a+1;p.a=a;if(parseInt(p.h)<=parseInt(p.a)){p.h=1;p.a=0;}}
  else if(win==='a'){p.a=a>h?a:h+1;p.h=h;if(parseInt(p.a)<=parseInt(p.h)){p.a=1;p.h=0;}}
  else{const v=Math.max(h,a,1);p.h=v;p.a=v;}
  save();render();
};
window.LQ=()=>{
  const u=S.users[S.cur];if(!u)return;
  const f=ALL.filter(m=>u.preds[m.id]&&u.preds[m.id].h!==''&&u.preds[m.id].a!=='').length;
  if(f<TOTAL){alert('Faltan '+(TOTAL-f)+' partidos');return;}
  if(confirm('¿Confirmas? No podrás modificar la fase de grupos.')){u.locked=true;save();render();}
};

window.SKO=(id,side,val)=>{
  const u=S.users[S.cur];if(!u||u.kolocked)return;
  if(!u.kopreds[id])u.kopreds[id]={h:'',a:''};
  u.kopreds[id][side]=val===''?'':(parseInt(val)>=0?parseInt(val):0);
  save();
};
window.SWKO=(id,win)=>{
  const u=S.users[S.cur];if(!u||u.kolocked)return;
  if(!u.kopreds[id])u.kopreds[id]={h:'',a:''};
  const p=u.kopreds[id];
  const h=parseInt(p.h)>=0?parseInt(p.h)||0:0,a=parseInt(p.a)>=0?parseInt(p.a)||0:0;
  if(win==='h'){p.h=h>a?h:a+1;p.a=a;if(parseInt(p.h)<=parseInt(p.a)){p.h=1;p.a=0;}}
  else if(win==='a'){p.a=a>h?a:h+1;p.h=h;if(parseInt(p.a)<=parseInt(p.h)){p.a=1;p.h=0;}}
  save();render();
};
window.LKO=()=>{
  const u=S.users[S.cur];if(!u)return;
  const f=KO_MATCHES.filter(m=>u.kopreds[m.id]&&u.kopreds[m.id].h!==''&&u.kopreds[m.id].a!=='').length;
  if(f<KO_MATCHES.length){alert('Faltan '+(KO_MATCHES.length-f)+' partidos');return;}
  if(confirm('¿Confirmas? No podrás modificar la fase eliminatoria.')){u.kolocked=true;save();render();}
};

window.SR=(id,side,val)=>{
  if(!S.results[id])S.results[id]={h:'',a:''};
  S.results[id][side]=val===''?'':(parseInt(val)>=0?parseInt(val):0);
};
window.SAR=btn=>{save();if(btn){btn.textContent='✅ Guardado!';setTimeout(()=>btn.textContent='💾 Guardar Resultados de Grupos',2000);}};
window.FAB_SAVE=async btn=>{
  await save();
  if(btn){
    const orig=btn.innerHTML;
    btn.innerHTML='✅ ¡Guardado!';
    btn.classList.add('saved');
    setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove('saved');},2000);
  }
};

// ===================== EDIT PICKS MODAL =====================
let EDIT_USER=null, EDIT_GRP='A';
window.OPEN_EDIT=name=>{
  EDIT_USER=name; EDIT_GRP='A';
  _renderEditModal();
};
function _renderEditModal(){
  const u=S.users[EDIT_USER];
  if(!u) return;
  const preds=u.preds||{};
  const grps=Object.keys(GROUPS);
  const tabs=grps.map(g=>`<button class="mgtab ${g===EDIT_GRP?'active':''}" onclick="EDIT_GRP='${g}';_renderEditModal()">${g}</button>`).join('');
  const matches=ALL.filter(m=>m.g===EDIT_GRP);
  const rows=matches.map(m=>{
    const p=preds[m.id]||{h:'',a:''};
    return `<div class="edit-match-row">
      <div class="edit-team"><span style="font-size:20px;">${F(m.h)}</span><span>${m.h}</span></div>
      <div class="edit-score-center">
        <div style="font-size:8px;color:var(--muted);margin-bottom:2px;">${m.d} ${m.t}</div>
        <div class="edit-score-row">
          <input type="number" class="edit-inp" min="0" max="20" value="${p.h}" oninput="EP_SET('${m.id}','h',this.value)" inputmode="numeric" pattern="[0-9]*">
          <span style="color:var(--muted);font-weight:700;">-</span>
          <input type="number" class="edit-inp" min="0" max="20" value="${p.a}" oninput="EP_SET('${m.id}','a',this.value)" inputmode="numeric" pattern="[0-9]*">
        </div>
      </div>
      <div class="edit-team"><span style="font-size:20px;">${F(m.a)}</span><span>${m.a}</span></div>
    </div>`;
  }).join('');
  const existing=document.getElementById('edit-modal-overlay');
  const html=`<div class="modal-overlay" id="edit-modal-overlay" onclick="if(event.target.id==='edit-modal-overlay')CLOSE_EDIT()">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">✏️ Editando quiniela de ${EDIT_USER}</div>
      <div class="modal-group-tabs">${tabs}</div>
      <div style="margin-bottom:12px;">${rows}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-full" onclick="SAVE_EDIT()">💾 Guardar cambios</button>
        <button class="btn btn-secondary" style="min-width:80px;" onclick="CLOSE_EDIT()">Cerrar</button>
      </div>
    </div>
  </div>`;
  if(existing) existing.outerHTML=html;
  else document.getElementById('root').insertAdjacentHTML('beforeend',html);
}
window.EP_SET=(id,side,val)=>{
  const u=S.users[EDIT_USER]; if(!u) return;
  if(!u.preds[id]) u.preds[id]={h:'',a:''};
  u.preds[id][side]=val===''?'':(parseInt(val)>=0?parseInt(val):0);
};
window.SAVE_EDIT=async ()=>{
  await save();
  const btn=document.querySelector('.modal-sheet .btn-primary');
  if(btn){btn.textContent='✅ Guardado!';setTimeout(()=>btn.textContent='💾 Guardar cambios',1800);}
};
window.CLOSE_EDIT=()=>{
  const el=document.getElementById('edit-modal-overlay');
  if(el) el.remove();
};

window.SKR=(id,side,val)=>{
  if(!S.koresults[id])S.koresults[id]={h:'',a:''};
  S.koresults[id][side]=val===''?'':(parseInt(val)>=0?parseInt(val):0);
};
window.SAKR=btn=>{save();if(btn){btn.textContent='✅ Guardado!';setTimeout(()=>btn.textContent='💾 Guardar Resultados Eliminación',2000);}};

window.SVP=()=>{const v=parseInt(document.getElementById('pinput').value)||0;S.prize=v;save();render();};
window.UU=n=>{if(confirm(`¿Desbloquear grupos de ${n}?`)){if(S.users[n]){S.users[n].locked=false;save();render();}}};
window.DEL=n=>{if(confirm(`¿Eliminar a ${n}?`)){delete S.users[n];save();render();}};

load();
</script>
</body>
