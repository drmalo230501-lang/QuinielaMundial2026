window.SHARE_CARD=function(playerName, qName){
  const q=getQ(qName); if(!q) return;
  const u=q.users[playerName]; if(!u) return;
  const stats=calcStats(u.preds||{},u.kopreds||{});
  const rank=getRanking(qName);
  const pos=rank.findIndex(r=>r.n===playerName)+1;
  const champ=getUserChampion(u);
  const badges=getAchievements(u.preds||{},u.kopreds||{});
  const canvas=document.createElement('canvas');
  canvas.width=600;canvas.height=320;
  const ctx=canvas.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,600,320);
  grad.addColorStop(0,'#07071a');grad.addColorStop(1,'#162a5e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,600,320);
  ctx.strokeStyle='rgba(255,215,0,0.4)';ctx.lineWidth=2;ctx.strokeRect(4,4,592,312);
  ctx.font='40px serif';ctx.fillText('\u{1F3C6}',24,64);
  ctx.fillStyle='#FFD700';ctx.font='bold 22px sans-serif';ctx.fillText('Quiniela Mundial 2026',78,44);
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='13px sans-serif';ctx.fillText(qName,78,64);
  ctx.fillStyle='#ffffff';ctx.font='bold 32px sans-serif';ctx.fillText(playerName,24,115);
  ctx.fillStyle='#FFD700';ctx.font='bold 16px sans-serif';
  ctx.fillText(pos>0?'#'+pos+' en el ranking':'Participante',24,140);
  [{label:'Puntos',val:stats.total,color:'#FFD700'},{label:'\u2705 Exactos',val:stats.exact,color:'#69ff6e'},
   {label:'\u2714 Ganador',val:stats.winner,color:'#FFD700'},{label:'\u274C Fallados',val:stats.miss,color:'#ff8a8a'}]
  .forEach((b,i)=>{
    const x=24+i*142;
    ctx.fillStyle='rgba(255,255,255,0.07)';
    ctx.beginPath();ctx.roundRect(x,160,130,70,8);ctx.fill();
    ctx.fillStyle=b.color;ctx.font='bold 28px sans-serif';ctx.fillText(String(b.val),x+12,200);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';ctx.fillText(b.label,x+12,224);
  });
  if(champ){
    ctx.fillStyle='rgba(255,255,255,0.07)';ctx.beginPath();ctx.roundRect(24,244,280,52,8);ctx.fill();
    ctx.fillStyle='#FFD700';ctx.font='bold 13px sans-serif';ctx.fillText('\u{1F451} Mi campe\u00f3n:',36,266);
    ctx.fillStyle='#ffffff';ctx.font='bold 18px sans-serif';ctx.fillText(champ,36,289);
  }
  if(badges.length){ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px sans-serif';ctx.fillText(badges.map(b=>b.icon+' '+b.label).join('  '),320,264);}
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='11px sans-serif';ctx.fillText('Quiniela Mundial 2026',320,296);
  canvas.toBlob(blob=>{
    const file=new File([blob],'quiniela-'+playerName+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({title:'Mi Quiniela Mundial 2026',files:[file]}).catch(()=>{});
    } else {
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quiniela-'+playerName+'.png';a.click();
    }
  });
};

        </div>
        <input type="hidden" id="${id}-val" value="${current}">
      </div>`;
  }

  const html=`
    <div id="ovr-modal" onclick="OVR_CLOSE_DROPDOWNS(event)"
      style="position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;">
      <div style="background:#1a1a3e;border:1px solid rgba(255,215,0,0.3);border-radius:16px;padding:20px;width:100%;max-width:340px;" onclick="event.stopPropagation()">
        <div style="font-size:14px;font-weight:800;color:var(--gold);margin-bottom:4px;">✏️ Forzar equipos</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:14px;">Partido: <strong>${matchId.toUpperCase()}</strong></div>

        <div style="display:flex;gap:8px;margin-top:4px;">
          <button onclick="SAVE_OVERRIDE('${matchId}')" class="btn btn-success" style="flex:1;">💾 Guardar</button>
          <button onclick="CLEAR_OVERRIDE('${matchId}')" class="btn btn-danger" style="flex:1;">🗑️ Quitar</button>
          <button onclick="document.getElementById('ovr-modal').remove()" class="btn btn-secondary">✕</button>
        </div>
      </div>
    </div>`;

  document.body.insertAdjacentHTML('beforeend', html);

  // Store teams globally for filter access
  window._ovrTeams = allTeams;

  // If there's a current value, mark it as selected
  ['ovr-h','ovr-a'].forEach(id=>{
    const val = document.getElementById(id+'-val').value;
    if(val && allTeams.includes(val)){
      document.getElementById(id+'-indicator').style.display='block';

window.OVR_FILTER=function(id){
  const inp=document.getElementById(id+'-inp');
  const list=document.getElementById(id+'-list');
  const val=inp.value.trim().toLowerCase();
  const teams=window._ovrTeams||[];
  const matches=val===''?teams:teams.filter(t=>t.toLowerCase().includes(val));

  list.innerHTML=matches.map(t=>`
    <div onclick="OVR_SELECT('${id}','${t.replace(/'/g,"\'")}');event.stopPropagation()"

      onmouseover="this.style.background='rgba(255,215,0,0.12)'"

      <span style="font-size:16px">${F(t)}</span><span>${t}</span>

window.EXPORT_EXCEL = function(qName) {
  const q = getQ(qName);
  if (!q) return;
  const R = getResults();
  const realResults = (R && R.results) || {};
  const realKO = (R && R.koresults) || {};
  const wb = XLSX.utils.book_new();

  // ── HOJA 1: RANKING ──────────────────────────────────────────
  const rankData = [['#','Participante','Pts','Exactos (2pts)','Ganador (1pt)','Fallados','Partidos jugados','Grupos bloqueado','Elim. bloqueado']];
  const ranking = getRanking(qName);
  ranking.forEach((r, i) => {
    const u = q.users[r.n] || {};
    rankData.push([
      i + 1, r.n, r.total, r.exact, r.winner, r.miss, r.played,
      u.locked ? 'Sí' : 'No',
      u.kolocked ? 'Sí' : 'No'
    ]);
  });
  // Add unranked (not locked yet)
  Object.entries(q.users || {}).filter(([,u]) => !u.locked).forEach(([n, u]) => {
    const filled = ALL.filter(m => u.preds && u.preds[m.id] && u.preds[m.id].h !== '').length;
    rankData.push(['—', n, '—', '—', '—', '—', `${filled}/${TOTAL} capturados`, 'No', u.kolocked ? 'Sí' : 'No']);
  });
  const wsRank = XLSX.utils.aoa_to_sheet(rankData);
  wsRank['!cols'] = [{wch:4},{wch:22},{wch:6},{wch:16},{wch:16},{wch:10},{wch:18},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsRank, 'Ranking');

  // ── HOJA 2: PREDICCIONES GRUPOS ──────────────────────────────
  const predHdr = ['Partido','Grupo','Fecha','Hora','Local','Visitante','Pred. Local','Pred. Visitante','Resultado Real'];
  const users = Object.keys(q.users || {});
  users.forEach(n => predHdr.push(n));
  const predData = [predHdr];

  ALL.forEach(m => {
    const real = realResults[m.id];
    const realTxt = real && real.h !== '' ? `${real.h}-${real.a}` : 'Pendiente';
    const row = [m.id, m.g, m.d, m.t, m.h, m.a, '', '', realTxt];
    users.forEach(n => {
      const p = (q.users[n].preds || {})[m.id];
      row.push(p && p.h !== '' ? `${p.h}-${p.a}` : '—');
    });
    predData.push(row);
  });
  const wsPred = XLSX.utils.aoa_to_sheet(predData);
  wsPred['!cols'] = [{wch:10},{wch:7},{wch:12},{wch:6},{wch:16},{wch:16},{wch:12},{wch:14},{wch:14}];
  users.forEach(() => wsPred['!cols'].push({wch:14}));
  XLSX.utils.book_append_sheet(wb, wsPred, 'Predicciones Grupos');

  // ── HOJA 3: PREDICCIONES ELIMINACIÓN ─────────────────────────
  const koHdr = ['Partido','Ronda','Fecha','Sede','Pred. Local','Pred. Visitante','Resultado Real'];
  users.forEach(n => koHdr.push(n));
  const koData = [koHdr];

  KO_MATCHES.forEach(m => {
    const real = realKO[m.id];
    const realTxt = real && real.h !== '' ? `${real.h}-${real.a}` : 'Pendiente';
    const row = [m.label, ROUND_LABELS[m.round] || m.round, m.d, m.v, m.hPos, m.aPos, realTxt];
    users.forEach(n => {
      const p = (q.users[n].kopreds || {})[m.id];
      row.push(p && p.h !== '' ? `${p.h}-${p.a}` : '—');
    });
    koData.push(row);
  });
  const wsKO = XLSX.utils.aoa_to_sheet(koData);
  wsKO['!cols'] = [{wch:8},{wch:22},{wch:12},{wch:18},{wch:18},{wch:18},{wch:14}];
  users.forEach(() => wsKO['!cols'].push({wch:14}));
  XLSX.utils.book_append_sheet(wb, wsKO, 'Predicciones Eliminación');

  // ── HOJA 4: DETALLE POR USUARIO ──────────────────────────────
  const detHdr = ['Participante','Partido','Grupo/Ronda','Local','Visitante','Mi predicción','Resultado Real','Puntos'];
  const detData = [detHdr];
  Object.entries(q.users || {}).forEach(([n, u]) => {
    ALL.forEach(m => {
      const p = (u.preds || {})[m.id];
      const real = realResults[m.id];
      const predTxt = p && p.h !== '' ? `${p.h}-${p.a}` : '—';
      const realTxt = real && real.h !== '' ? `${real.h}-${real.a}` : 'Pendiente';
      const res = matchResult(p, real);
      const pts = res === 'exact' ? 2 : res === 'winner' ? 1 : res === 'pending' ? '—' : 0;
      detData.push([n, m.id, `Grupo ${m.g}`, m.h, m.a, predTxt, realTxt, pts]);
    });
    KO_MATCHES.forEach(m => {
      const p = (u.kopreds || {})[m.id];
      const real = realKO[m.id];
      const predTxt = p && p.h !== '' ? `${p.h}-${p.a}` : '—';
      const realTxt = real && real.h !== '' ? `${real.h}-${real.a}` : 'Pendiente';
      const res = matchResult(p, real);
      const pts = res === 'exact' ? 2 : res === 'winner' ? 1 : res === 'pending' ? '—' : 0;
      detData.push([n, m.label, ROUND_LABELS[m.round] || m.round, m.hPos, m.aPos, predTxt, realTxt, pts]);
    });
  });
  const wsDet = XLSX.utils.aoa_to_sheet(detData);
  wsDet['!cols'] = [{wch:22},{wch:10},{wch:22},{wch:16},{wch:16},{wch:14},{wch:14},{wch:7}];
  XLSX.utils.book_append_sheet(wb, wsDet, 'Detalle por usuario');

  // ── DESCARGAR ─────────────────────────────────────────────────
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Quiniela_${qName}_${fecha}.xlsx`);
};

// Auto-refresh every 30 seconds when admin is viewing users
setInterval(()=>{
  if(S.admin && (S.tab==='aq'||S.tab==='au')) {
    load();
  }
}, 30000);
</script>
